name: check

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck setup.sh
      - name: docsync
        run: |
          curl -sSfL -o docsync https://github.com/Dvorinka/docsync/releases/download/v0.1.0/docsync-v0.1.0-linux-amd64
          chmod +x docsync
          ./docsync check --baseline .docsync-baseline.json
